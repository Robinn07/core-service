
#
# Nginx Configuration for Custom Domains in a Multi-Tenant SaaS Application
#
# This configuration block demonstrates how to set up Nginx as a reverse proxy
# to handle custom domains, perform dynamic routing to backend services, and
# manage SSL/TLS certificates for these domains.
#
# IMPORTANT CONSIDERATIONS:
# 1. On-Demand TLS: Nginx does not natively support "On-Demand TLS" like Caddy.
#    For custom domains, you typically need to:
#    a) Pre-provision SSL certificates (e.g., using Certbot with DNS-01 or HTTP-01 challenges,
#       or through a certificate management system) and ensure Nginx can access them.
#    b) Use a frontend proxy like Cloudflare, AWS ALB, or Caddy that handles TLS
#       termination and certificate issuance, then forwards traffic to Nginx.
#    This configuration assumes certificates are managed and available for Nginx
#    or that a separate TLS-handling proxy is in front of Nginx.
#
# 2. Dynamic Upstream Routing: For truly dynamic routing based on custom domains
#    that are added/removed frequently, you might need more advanced solutions like:
#    a) Nginx Plus (commercial version) for dynamic upstream configuration.
#    b) OpenResty (Nginx + Lua) to query a database/cache (e.g., Redis) in real-time
#       for upstream mapping and tenant identification.
#    This example uses a simple `map` directive for demonstration, which requires
#    reloading Nginx for changes. For a production-ready solution with many domains,
#    consider OpenResty or a similar approach.
#
# 3. Security: This configuration includes basic measures against common vulnerabilities
#    like Host header injection by having a default server block.
#

# --- Upstream Definitions ---
# Define your backend services. In a multi-tenant setup, you might have
# a single backend service handling all tenants, or tenant-specific deployments.
# For simplicity, we assume a single primary backend service.
upstream backend_service_default {
    server 127.0.0.1:8000; # Example: Your main application backend (e.g., Python FastAPI/Flask)
    # Add more servers for load balancing and high availability
    # server 127.0.0.1:8001;
}

# If you have different backend services for different domains, you can define more upstreams:
# upstream backend_service_tenant_A {
#     server 127.0.0.1:8002;
# }
# upstream backend_service_tenant_B {
#     server 127.0.0.1:8003;
# }


# --- Map for Dynamic Backend Selection (Basic Example) ---
# This map dynamically selects an upstream based on the Host header.
# For a large number of dynamic custom domains, consider using OpenResty (Nginx+Lua)
# to query a real-time source (database/cache) for this mapping.
# The `hostnames` parameter ensures case-insensitive matching.
map $http_host $backend_upstream {
    hostnames; # Enable case-insensitive hostname matching

    # Your primary platform domain(s)
    default                  backend_service_default;
    your-platform.com        backend_service_default;
    www.your-platform.com    backend_service_default;
    app.your-platform.com    backend_service_default;

    # --- Custom Tenant Domains ---
    # These entries would typically be generated dynamically or managed by an automation system.
    # For a real system, you'd likely use a scripting language (e.g., Lua) to lookup
    # the backend dynamically from a cache/database.
    #
    # Example for a specific custom domain:
    # app.customer-one.com     backend_service_default;
    # app.customer-two.com     backend_service_default;
    #
    # Wildcard example (if all custom domains point to the same backend):
    # ~^(?<subdomain>[^.]+)\.customer-one\.com$ backend_service_default;
    # ~^(?<subdomain>[^.]+)\.customer-two\.com$ backend_service_default;

    # Fallback for any other custom domain that has been properly configured in DNS
    # and has a certificate, assuming they all route to the same default backend.
    # This might catch legitimate custom domains not explicitly listed above.
    # If using OpenResty, this logic would be much more sophisticated.
    "~."                     backend_service_default; # Catch-all for any host that doesn't match above
}

# --- Main HTTP Server Block ---
# Redirect HTTP to HTTPS for all domains
server {
    listen 80;
    listen [::]:80;
    server_name _; # Listen on all hostnames

    # Deny requests with no Host header to prevent Host Header Injection
    if ($host = "") {
        return 400; # Bad Request
    }

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}


# --- Main HTTPS Server Block for Custom Domains ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    # Wildcard server_name to catch all incoming custom domains.
    # This requires a wildcard SSL certificate, or a mechanism to load
    # specific certificates based on the hostname (SNI).
    server_name _; # Catch all hostnames for SSL processing

    # Deny requests with no Host header
    if ($host = "") {
        return 400; # Bad Request
    }

    # --- SSL Certificate Configuration ---
    # This section is crucial. For "On-Demand TLS", you would typically have:
    # A) A single wildcard certificate (e.g., *.your-platform.com) for subdomains,
    #    and then dynamically load individual certificates for custom domains.
    # B) An external service (e.g., Caddy, custom cert manager) providing certificates.
    #
    # Example of a wildcard certificate (if you manage them directly for subdomains)
    # ssl_certificate      /etc/nginx/ssl/wildcard.your-platform.com/fullchain.pem;
    # ssl_certificate_key  /etc/nginx/ssl/wildcard.your-platform.com/privkey.pem;

    # For truly dynamic custom domains, Nginx needs to load certificates based on SNI.
    # This usually means you have a certificate storage and a mechanism to point Nginx to them.
    # If using a separate service for TLS termination (like Caddy or Cloudflare),
    # then Nginx would not handle SSL here, and you'd listen on HTTP internally.
    #
    # For simplicity, we'll use placeholder certificates. In production, these
    # *must* be valid certificates for the specific domain or a wildcard covering it.
    ssl_certificate      /etc/nginx/ssl/default.crt; # Placeholder: Replace with your actual default/wildcard cert
    ssl_certificate_key  /etc/nginx/ssl/default.key; # Placeholder: Replace with your actual default/wildcard key

    # Enable OCSP stapling
    # ssl_stapling on;
    # ssl_stapling_verify on;
    # resolver 8.8.8.8 8.8.4.4 valid=300s; # Google Public DNS
    # resolver_timeout 5s;

    # SSL protocols and ciphers for security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS (HTTP Strict Transport Security) - enforce HTTPS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Other security headers
    add_header X-Frame-Options "DENY";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "no-referrer-when-downgrade";

    # Proxy settings
    proxy_redirect off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90;

    # --- Tenant ID Injection (Example) ---
    # If you have a predefined mapping of custom domains to tenant IDs,
    # Nginx can inject a header. For truly dynamic lookups (millions of domains),
    # you would use OpenResty (Lua) to query a cache like Redis.
    #
    # Example using a static map (requires Nginx reload for changes):
    # map $http_host $tenant_id_header {
    #     hostnames;
    #     app.customer-one.com "tenant-uuid-123";
    #     app.customer-two.com "tenant-uuid-456";
    #     default              ""; # No tenant ID for unknown hosts
    # }
    # if ($tenant_id_header != "") {
    #     proxy_set_header X-Tenant-ID $tenant_id_header;
    # }

    location / {
        # Dynamically route to the selected backend upstream
        proxy_pass http://$backend_upstream;
    }

    # You might want to define other locations, e.g., for static assets
    # location /static/ {
    #     alias /var/www/your_app/static/;
    #     expires 30d;
    #     access_log off;
    #     log_not_found off;
    # }

    # Error pages
    error_page 400 401 403 404 500 502 503 504 /error.html;
    location = /error.html {
        root /usr/share/nginx/html; # Or your custom error page location
        internal;
    }
}

# --- Default Server Block for Unmatched Hostnames ---
# This server block catches any requests not matched by the specific server_names
# in other blocks. It's crucial for security to prevent Host header injection
# and to gracefully handle invalid domain requests.
server {
    listen 443 ssl http2 default_server; # This acts as the default catch-all for SSL
    listen [::]:443 ssl http2 default_server;

    server_name _; # Matches any hostname

    # Deny requests with no Host header
    if ($host = "") {
        return 400; # Bad Request
    }

    # Use a dummy certificate for default_server.
    # This prevents handshake failures for unknown hostnames, but still maintains TLS.
    # In production, ensure this points to a valid certificate that you own.
    ssl_certificate      /etc/nginx/ssl/default.crt; # Placeholder
    ssl_certificate_key  /etc/nginx/ssl/default.key; # Placeholder

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Return a 444 (No Response) for unmatched hostnames.
    # This is a common practice to quietly drop invalid requests without sending a full response.
    # Alternatively, you could return a 403 Forbidden, or redirect to your main platform domain.
    return 444; # No Response
}
