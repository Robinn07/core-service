upstream crm_api {
    server 127.0.0.1:4000;
    keepalive 64;
}

upstream ingestion_api {
    server 127.0.0.1:3000;
    keepalive 64;
}

upstream analytics_api {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name api.getloopx.com;

    # Redirect all HTTP to HTTPS (Certbot will automate this, but good to have)
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name api.getloopx.com;

    # SSL managed by Certbot
    # ssl_certificate /etc/letsencrypt/live/api.getloopx.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.getloopx.com/privkey.pem;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 1. CRM Service (Main API)
    location / {
        proxy_pass http://crm_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # 2. Ingestion Service (SDK / Tracking)
    location /ingest/ {
        proxy_pass http://ingestion_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 3. Analytics Service (Python)
    location /analytics/ {
        proxy_pass http://analytics_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}
